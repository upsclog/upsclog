<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSC LoG — Make Payment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,450&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E1B2E;
    --navy-deep:#081120;
    --paper:#FBF8F1;
    --gold:#C6A15B;
    --gold-bright:#E7C482;
    --maroon:#7B2D2D;
    --text-light:#ECE5D4;
    --text-dim:#9FA9BC;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:
      radial-gradient(circle at 85% 0%, rgba(198,161,91,0.10), transparent 45%),
      radial-gradient(circle at 5% 100%, rgba(123,45,45,0.12), transparent 40%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--text-light);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2{font-family:'Fraunces',serif;font-weight:450;}
  a{text-decoration:none;color:inherit;}

  /* ---------- Top bar / back button ---------- */
  .topbar{
    display:flex;
    align-items:center;
    padding:34px 6vw 0 6vw;
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:10px 20px 10px 16px;
    border:1px solid rgba(198,161,91,0.35);
    border-radius:999px;
    font-size:13px;
    letter-spacing:0.5px;
    color:var(--gold-bright);
    transition:border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;
    background:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .back-btn svg{width:16px;height:16px;stroke:var(--gold-bright);fill:none;stroke-width:2;}
  .back-btn:hover{
    border-color:var(--gold-bright);
    background:rgba(198,161,91,0.08);
    transform:translateX(-3px);
  }

  /* ---------- Page wrapper ---------- */
  .wrap{
    max-width:1200px;
    margin:0 auto;
    padding:44px 4vw 90px 4vw;
    text-align:center;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--gold);
  }
  .eyebrow::before, .eyebrow::after{content:"—"; color:var(--maroon); margin:0 12px;}
  .wrap h1{
    font-size:clamp(1.6rem, 4vw, 2.2rem);
    color:var(--paper);
    margin-top:16px;
  }
  .wrap > p.sub{
    margin-top:14px;
    color:var(--text-dim);
    font-weight:300;
    line-height:1.7;
    font-size:clamp(15px, 2.4vw, 18px);
  }

  /* ---------- Subscription image panel ---------- */
  .image-panel{
    margin:38px auto 0 auto;
    background:linear-gradient(180deg, rgba(246,241,228,0.05), rgba(246,241,228,0.015));
    border:1px solid rgba(198,161,91,0.25);
    border-top:2px solid var(--gold);
    border-radius:4px;
    padding:20px;
    position:relative;
    max-width:900px;
  }
  .image-panel::before{
    content:"";
    position:absolute;
    top:8px; left:8px; right:8px; bottom:8px;
    border:1px solid rgba(198,161,91,0.10);
    pointer-events:none;
  }

  /* Two-image row: side by side on desktop, stacked on mobile */
  .image-row{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:row;
    width:100%;
  }
  .image-box{
    flex:1 1 0;
    aspect-ratio:1/1;
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    min-width:0; /* prevents flex overflow from squishing images unevenly */
  }
  .image-box img{
    width:100%;
    height:100%;
    object-fit:contain; /* ensures full image visible, nothing cropped */
    display:block;
  }

  /* thin demarcation line between the two images */
  .image-row .image-box:first-child{
    border-radius:4px 0 0 4px;
    border-right:1px solid var(--navy-deep);
  }
  .image-row .image-box:last-child{
    border-radius:0 4px 4px 0;
  }

  /* Rounded outer corners on the whole row, matching original panel radius */
  .image-row{
    border-radius:4px;
    box-shadow:0 12px 30px rgba(0,0,0,0.35);
  }

  /* ---------- Done button ---------- */
  .done-btn{
    display:block;
    width:100%;
    margin-top:34px;
    padding:24px 28px;
    background:var(--gold);
    color:var(--navy-deep);
    border:none;
    border-radius:999px;
    font-size:clamp(16px, 2.4vw, 20px);
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    transition:background 0.3s ease, transform 0.3s ease;
  }
  .done-btn:hover{
    background:var(--gold-bright);
    transform:translateY(-2px);
  }

  @media (max-width:520px){
    .topbar{padding:26px 6vw 0 6vw;}
    .wrap{padding:36px 6vw 70px 6vw;}
    .image-panel{padding:12px;}

    /* stack images vertically on mobile with a thin horizontal divider */
    .image-row{
      flex-direction:column;
    }
    .image-box{
      flex:none;
      width:100%;
    }
    .image-row .image-box:first-child{
      border-radius:4px 4px 0 0;
      border-right:none;
      border-bottom:1px solid var(--navy-deep);
    }
    .image-row .image-box:last-child{
      border-radius:0 0 4px 4px;
    }
  }
</style>
</head>
<body>

  <a class="back-btn" href="../free_prelims_test_series.html">

<div class="wrap">
  <h1>UPSC LoG MAINS MONK</h1>
  <p class="sub">UPSC LoG Mains Monk batch is live. Be mains ready before Prelims 2027.</p>

  <div class="image-panel">
    <div class="image-row">
      <div class="image-box">
        <img src="mains_monk_subscription_image.png" alt="Mains Monk Subscription Details">
      </div>
      <div class="image-box">
        <img src="mains_monk_subscription_image_2.png" alt="Mains Monk Subscription Details 2">
      </div>
    </div>
  </div>

  <button class="done-btn" onclick="window.location.href='payment/signup_form.html'">CONTINUE TO PAYMENT PAGE</button>
</div>

</body>
</html>
